- name: Assert Debian 13 or newer
  assert:
    that:
      - ansible_distribution == "Debian"
      - ansible_distribution_major_version | int >= 13
    fail_msg: >-
      roles/sway targets Debian 13 (trixie) or newer; found
      {{ ansible_distribution }} {{ ansible_distribution_major_version }}.
      Older releases ship pipewire 0.3.x, where wireplumber 0.5 and
      pipewire-alsa are unavailable or incompatible.

- name: Install core packages
  apt:
    update_cache: true
    pkg:
      - sway

- name: Install portals and xwayland
  apt:
    update_cache: false
    pkg:
      - xdg-desktop-portal
      - xdg-desktop-portal-wlr
      - xwayland
      - wayland-protocols
      - libwayland-dev

- name: Install extras
  apt:
    update_cache: false
    pkg:
      - grim
      - wl-clipboard
      - imv
      - wob
      - clipman
      - wofi
      - mako-notifier
      - libnotify-bin

- name: Install audio stack
  apt:
    update_cache: false
    pkg:
      - pipewire
      - pipewire-pulse
      - pipewire-alsa
      - wireplumber
      - libspa-0.2-bluetooth

- name: Install brightnessctl on laptops
  apt:
    name: brightnessctl
    state: present
  when: ansible_form_factor in ['Notebook', 'Laptop', 'Portable', 'Sub Notebook', 'Hand Held']

- name: Copy configure laptop display script to sway configuration directory
  copy:
    src: sway-laptop-display.sh
    dest: /usr/local/bin/sway-laptop-display.sh
    mode: "0755"

# udev rule to configure screens and desktop background when HDMI plug in or out
- name: Copy on_hdmi_connected.rules to /etc/udev/rules.d/
  copy:
    src: "on_hdmi_connected.rules"
    dest: /etc/udev/rules.d/on_hdmi_connected.rules
    mode: "0644"

# Install the swaybar status line binary from its GitHub release.
- name: Ensure sway config directory exists
  become: true
  become_user: "{{ username }}"
  file:
    path: "/home/{{ username }}/.config/sway"
    state: directory
    mode: "0755"

- name: Download the statusBar binary
  become: true
  become_user: "{{ username }}"
  get_url:
    url: https://github.com/RolandWarburton/sway-bar-status-line/releases/latest/download/statusBar
    dest: "/home/{{ username }}/.config/sway/statusBar"
    mode: "0755"
    force: true

# Build swaybar status line config.
# Pulls credentials from OpenBao to set PTV secret.
# kv/data/common/ptv
- name: Stat openbao-get-secret
  stat:
    path: /usr/local/sbin/openbao-get-secret
  register: swaybar_openbao_get_secret

- name: Stat openbao token
  stat:
    path: /etc/credentials/openbao-token
  register: swaybar_openbao_token

- name: Stat swaybar config directory
  stat:
    path: "/home/{{ username }}/.config/swaybar"
  register: swaybar_config_dir

- name: Fetch PTV secrets from OpenBao
  become: true
  command: openbao-get-secret kv/data/common/ptv
  register: swaybar_ptv_raw
  changed_when: false
  failed_when: false
  no_log: true
  when:
    - swaybar_openbao_get_secret.stat.exists
    - swaybar_openbao_token.stat.exists

- name: Set swaybar PTV credentials from OpenBao
  set_fact:
    swaybar_ptv_devid: "{{ (swaybar_ptv_raw.stdout_lines | select('match', '^PTV_DEVID=') | first).split('=', 1)[1] }}"
    swaybar_ptv_key: "{{ (swaybar_ptv_raw.stdout_lines | select('match', '^PTV_KEY=') | first).split('=', 1)[1] }}"
  no_log: true
  when:
    - swaybar_ptv_raw.rc is defined
    - swaybar_ptv_raw.rc == 0
    - swaybar_ptv_raw.stdout_lines | select('match', '^PTV_DEVID=') | list | length > 0
    - swaybar_ptv_raw.stdout_lines | select('match', '^PTV_KEY=') | list | length > 0

- name: Deploy swaybar config
  become: true
  become_user: "{{ username }}"
  template:
    src: swaybar-config.yml.j2
    dest: "/home/{{ username }}/.config/swaybar/config.yml"
    mode: "0644"
  no_log: true
  when: swaybar_config_dir.stat.exists
