# Roles that build with cargo (ripdrag, satty, swww,
# alacritty) run it as "{{ username }}", not root, so
# that user needs its own rustup default toolchain.
# Without it rustup exits with "could not choose a
# version of cargo to run".

- name: Check rustup toolchain for "{{ username }}"
  become: true
  become_user: "{{ username }}"
  command: rustup show active-toolchain
  register: rust_user_toolchain
  changed_when: false
  failed_when: false

- name: Set rust to stable branch for "{{ username }}"
  become: true
  become_user: "{{ username }}"
  command: rustup default stable
  when: "'stable' not in rust_user_toolchain.stdout"
  changed_when: true
