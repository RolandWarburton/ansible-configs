# ----------------------------------------------------------
# Core

# The board runs on the vendor's own account. No extra user is created: the
# image ships `radxa`, already in the sudo group, and a second account buys
# nothing on a single-purpose board. This is the BOARD's user, and it is
# deliberately independent of `username`, which is the workstation's.
bootstrap_radxa_zero_board_user: "radxa"

bootstrap_radxa_zero_pubkey: "~/.ssh/id_rsa.pub"

# The short hostname this role sets on the board. `inventory_hostname`
# (zero.local) is the mDNS name that follows from it, and is what every later
# play connects to.
bootstrap_radxa_zero_hostname: "zero"

# What a freshly imaged board announces itself as, before this role has
# renamed it. Used for first contact only -- see preflight.yml.
bootstrap_radxa_zero_vendor_hostname: "radxa.local"

bootstrap_radxa_zero_preflight_timeout: 5

# -----------------------------------------------------------
# Beacon

bootstrap_radxa_zero_beacon_registry_url: "https://beacon.wirecrop.net"
bootstrap_radxa_zero_beacon_bin: "/usr/local/bin/beacon-register"
bootstrap_radxa_zero_beacon_unit_dir: "/etc/systemd/system"

# ----------------------------------------------------------
# nginx

# A high port on purpose. The board is LAN-only with no certificate, so there
# is nothing to gain from port 80 -- and leaving it free keeps the packaged
# default site out of the way. zero.local:8080 is what you open.
bootstrap_radxa_zero_nginx_port: 8080

bootstrap_radxa_zero_nginx_site: "zero"

# Kept apart from the mutagen sync target (~/dev) so a sync deletion cannot
# empty the site. See tasks/nginx.yml before pointing this at it.
bootstrap_radxa_zero_nginx_root: "/var/www/zero"

# Drop the packaged site that listens on 80. It does not clash with ours.
bootstrap_radxa_zero_nginx_disable_default: true

# ----------------------------------------------------------
# Remote dev

# The user on THIS machine, which is not the board's user. Everything
# delegated to localhost runs as this account. Read from localhost's own
# host_vars rather than `username`, which resolves against the board being
# converged and would drag the board's identity onto the workstation.
# Defined first because the paths below are built from it.
bootstrap_radxa_zero_local_user: "{{ hostvars['localhost']['username'] }}"

bootstrap_radxa_zero_project: "zero"

# The local user home on THIS machine
bootstrap_radxa_zero_mutagen_bin_dir: "/home/{{ bootstrap_radxa_zero_local_user }}/.local/bin"

bootstrap_radxa_zero_local_dir: "/home/{{ bootstrap_radxa_zero_local_user }}/projects/{{ bootstrap_radxa_zero_project }}"

# The sync root itself: the contents of the local project dir land directly
# in ~/dev on the board, with no per-project subfolder underneath.
bootstrap_radxa_zero_remote_dir: "/home/{{ bootstrap_radxa_zero_board_user }}/dev"

# Derived from the host being converged rather than an ssh alias, so the sync
# always lands on the board this play is actually targeting. Uses
# inventory_hostname, not the vendor name: by the time mutagen runs the board
# has been renamed and answers as zero.local.
bootstrap_radxa_zero_beta_host: "{{ bootstrap_radxa_zero_board_user }}@{{ inventory_hostname }}"

bootstrap_radxa_zero_sync_name: "{{ bootstrap_radxa_zero_project }}"
bootstrap_radxa_zero_sync_mode: "two-way-resolved"

# How long to wait for the renamed board to come back under its new mDNS name
# before giving up on creating the sync session.
bootstrap_radxa_zero_ssh_retries: 12
bootstrap_radxa_zero_ssh_delay: 5

bootstrap_radxa_zero_sync_ignore:
  - "*.swp"
  - "*~"
  - ".DS_Store"

bootstrap_radxa_zero_mutagen_version: "0.18.1"
bootstrap_radxa_zero_mutagen_url: "https://github.com/mutagen-io/mutagen/releases/download/v{{ bootstrap_radxa_zero_mutagen_version }}"
