# ---------------------------------------------------------------------
# preflight
#
# Also decides which name to connect on and gathers the board's facts, so it
# has to come first and the play must not gather facts itself.

- name: Check the board is reachable
  import_tasks: preflight.yml
  tags: always

# -------------------------------------------------------------------
# bootstrap
#
# No account is created. The board runs on the vendor's own `radxa` user,
# which the image ships in the sudo group with a working password, so nothing
# here touches authentication beyond adding a key. sudo is left as the image
# configures it and the play is run with --ask-become-pass.

- name: Authorise the workstation ssh key
  authorized_key:
    user: "{{ bootstrap_radxa_zero_board_user }}"
    key: "{{ lookup('file', bootstrap_radxa_zero_pubkey) }}"
    state: present

- name: Set the static hostname
  hostname:
    name: "{{ bootstrap_radxa_zero_hostname }}"

# Without this sudo logs a "unable to resolve host" warning on every call.
- name: Map the hostname to the loopback address
  lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1\t{{ bootstrap_radxa_zero_hostname }}"
    state: present
    mode: "0644"

- name: Install avahi for mDNS discovery
  apt:
    name: avahi-daemon
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable the avahi daemon
  systemd:
    name: avahi-daemon
    enabled: true
    state: started

# On the run that renames the board, avahi is still announcing the vendor name
# until it is restarted. Everything downstream reaches the board as
# zero.local, so the new name has to be on the wire before we get there.
- name: Re-announce the board under its new name
  systemd:
    name: avahi-daemon
    state: restarted
  when: not bootstrap_radxa_zero_configured_ok

# ---------------------------------------------------------------------
# beacon install
- name: Manage the ip-beacon client
  import_tasks: beacon.yml
  tags: beacon

# ----------------------------------------------------------------
# mutagen remote dev
- name: Prepare the board as a remote development target
  import_tasks: remote-dev.yml
  tags: remote-dev
