# The vendor account ships with a known password, and sshd on this board accepts
# password authentication, so it is a second way in that nothing else in this
# repo manages. Locking the password removes password login and, because sudo
# then has no password it can accept, removes that account's route to root.
#
# Key authentication is deliberately left alone: the workstation key is in the
# vendor account's authorized_keys and stays usable, so this is not a lockout.
# Recovery from any mistake here is a card reader away -- / is unencrypted ext4
# on removable SD.
#
# Skipped when the play is CONNECTED as the vendor account, which is the case on
# a freshly imaged board: locking it mid-run would break sudo for every task
# after this one. The first converge leaves it alone, and any later converge as
# the primary user does the locking.
- name: Look up the vendor account
  getent:
    database: passwd
    key: "{{ bootstrap_radxa_zero_vendor_user }}"
    fail_key: false

- name: Lock the vendor account password
  user:
    name: "{{ bootstrap_radxa_zero_vendor_user }}"
    password_lock: true
  when:
    - bootstrap_radxa_zero_vendor_user in ansible_facts.getent_passwd
    - ansible_env.SUDO_USER | default('') != bootstrap_radxa_zero_vendor_user
